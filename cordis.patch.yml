# dsh-abacus bundle patch: inserts its single plugin row into the web
# plugin roster. The row mounts BOTH halves at once — the host side (token
# ledger folded from `session/event`, the `api/abacus/*` JSON routes) and
# the browser side (the module the web plugin roster serves from this
# package's `./client` export).
#
# Install into a profile with:
#   dsh plugin --profile desktop add link:<path-to-this-package>
# or by adding the path to the profile's package.json dependencies and running
# pnpm install there. See README.md for the full procedure.
- insert:
    - id: abacus
      name: 'dsh-abacus'
